<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- 圆角图标底板 -->
  <rect x="64" y="64" width="896" height="896" rx="192" ry="192" fill="url(#bgGrad)"/>

  <!-- 盾牌主体 -->
  <path d="M512 200 L256 304 v200 c0 150 112 280 256 336 c144-56 256-186 256-336 V304 L512 200z" fill="url(#shieldGrad)"/>

  <!-- 角度更自然的圆润 V -->
  <path d="M 380 380 L 512 670 L 644 380" 
        stroke="url(#vGrad)" 
        stroke-width="74" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
</svg>