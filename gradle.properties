# =======================================================
# Android & Kotlin 默认核心设置 (保持不变)
# =======================================================
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
android.useAndroidX=true

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies
android.nonTransitiveRClass=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official


# =======================================================
# Gradle 性能优化配置 (针对 16GB 大内存手机优化)
# =======================================================
# 1. 开启守护进程：让 Gradle 驻留内存，不用每次编译都重新启动 JVM 环境
org.gradle.daemon=true

# 2. 开启并行编译：允许多个不相关的任务同时运行，榨干手机的多核 CPU
org.gradle.parallel=true

# 3. 开启构建缓存：复用之前已经编译过的未修改部分
org.gradle.caching=true

# 4. 开启配置缓存：跳过 Gradle 缓慢的“配置阶段”（第二次运行起飞的关键）
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# 5. 调整 JVM 内存分配：(替换了新建项目默认的 2048m)
# 分配 4GB 堆内存，使用 UseParallelGC 在多核手机上提升吞吐量
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# 6. 为 Kotlin 守护进程单独分配 2GB 内存，加速 Kotlin 源码解析
kotlin.daemon.jvm.options=-Xmx2048m

# 7. Kotlin 增量编译
kotlin.incremental.useClasspathSnapshot=true